<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">Personality Quiz</h1>
    <p class="text-center">Answer the following questions to discover your personality type!</p>

    <!-- Question/Answer set 1 -->
    <div class="container d-flex justify-content-center quiz-question" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">Of these options, what is your favorite music genre?</h4>
        <div id="page1Options" class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-value="5" >Jazz</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-value="10">Classical</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-value="15">Pop</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-value="20">Rock</button>
          </div>
        </div>
      </div>
    </div>
    <!-- End of Question/Answer set 1 -->

    <!-- Feedback message for the selected answer -->
    <p id="output-message" class="text-center fs-5"></p>

    <!-- Next / Show Results buttons -->
    <div class="container d-flex justify-content-center">
      <button id="next-btn" class="btn btn-primary my-4" disabled>Next</button>
      <button id="show-result" class="btn btn-success my-4 d-none" disabled>Show Results</button>
    </div>

    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>

    <!-- Connect to your script file here -->
    <script src="./js/script.js"></script>
</body>
</html>
